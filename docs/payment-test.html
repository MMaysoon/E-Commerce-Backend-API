
<!DOCTYPE html>
<html>
<head>
    <title>Stripe Payment Test</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <h2>Test Payment</h2>

    <form id="payment-form">
        <div id="payment-element"></div>
        <button id="submit" type="submit">Pay Now</button>
        <div id="payment-message"></div>
    </form>

    <script>
        // publishable key -> stripe dashboard
        const stripe = Stripe("pk_test_51UfYzt00sPUiS7pGVznoAGE4kdGq9NjKbDrRYu80SOR3p9Etwq7J7wv98gP8bE8khKbMGyKGejnWVK312zhRbyye00vKRskYJn");

        //client secret -> from create payment intent by basket id 
        const clientSecret = "pi_3Ug8qO00sPUiS7pG1adKxJiz_secret_5ut2lAdP1ICQNeWRYcDbmKdMB";

        const elements = stripe.elements({ clientSecret });

        const paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

        const form = document.getElementById("payment-form");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("submit");
            button.disabled = true;

            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.href
                }
            });

            if (error) {
                document.getElementById("payment-message").textContent =
                    error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
